
services:
  db:
    image: postgres:17-alpine
    container_name: pastel_shop_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: pastel_shop_api
    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      PORT: 3000
      MYSQLHOST: mysql
      MYSQLPORT: 3306
      MYSQLUSER: pastel_app
      MYSQLPASSWORD: "${MYSQL_PASSWORD}"
      MYSQLDATABASE: pastel_shop

    depends_on:
      db:
        condition: service_healthy

    networks:
      - default
      - webdevnet

volumes:
  postgres_data:

networks:
  webdevnet:
    external: true
    name: webdev-stack_devnet